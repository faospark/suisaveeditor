[package]
name = "brightshield"
version = "1.4.17"
edition = "2021"
description = "Bright Shield Save Editor — Native Rust (iced) edition of the Suikoden II HD Remaster Save Editor"

[[bin]]
name = "BrightShield"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["image"] }
image = { version = "0.24", default-features = false, features = ["png"] }
rfd = "0.15"
serde_json = { version = "1.0", features = ["preserve_order"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev.package."*"]
opt-level = 2
